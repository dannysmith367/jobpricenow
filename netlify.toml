[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/estimate"
  to = "/.netlify/functions/estimate"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog-index"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog-post?slug=:slug"
  status = 200
