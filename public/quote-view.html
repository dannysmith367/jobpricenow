<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Your Quote — JobPriceNow</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .qv-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  .qv-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
  @media (max-width: 420px) { .qv-actions { grid-template-columns: 1fr; } }
  .qv-btn { padding: 13px; font-size: 14.5px; font-weight: 700; border-radius: 10px; text-align: center; cursor: pointer; text-decoration: none; }
  .qv-btn.primary { background: var(--blue); color: #fff; border: none; }
  .qv-btn.secondary { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); }
  .qv-frame { width: 100%; height: 70vh; border: 1px solid #D6DDE6; border-radius: 10px; margin-top: 16px; }
  .qv-email-row { display: flex; gap: 8px; margin-top: 10px; }
  .qv-email-row input { flex: 1; padding: 10px 12px; border: 1px solid #D6DDE6; border-radius: 8px; font-family: var(--font); font-size: 14px; box-sizing: border-box; }
  .qv-status { font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="brand" aria-label="JobPriceNow home"><span class="brand-word">JobPrice<span class="accent">Now</span></span></a>
  </div>
</header>

<main class="qv-wrap">
  <div id="qv-loading" class="card loading-box">
    <div class="spinner" aria-hidden="true"></div>
    <div id="qv-loading-message">Finding your quote…</div>
  </div>

  <div id="qv-app" style="display:none;">
    <h1 style="font-size:20px;color:var(--navy);">Your quote is ready</h1>
    <p class="subhead" style="margin-top:4px;">Download, print, or share it directly with your customer.</p>

    <div class="qv-actions">
      <a href="#" id="qv-download" class="qv-btn primary" target="_blank">Download PDF</a>
      <button type="button" id="qv-print" class="qv-btn secondary">Print</button>
      <button type="button" id="qv-share" class="qv-btn secondary" style="display:none;">Share Quote</button>
      <button type="button" id="qv-email-toggle" class="qv-btn secondary">Email Quote</button>
    </div>

    <div id="qv-email-panel" style="display:none;">
      <div class="qv-email-row">
        <input type="email" id="qv-email-input" placeholder="customer@email.com" />
        <button type="button" id="qv-email-send" class="qv-btn primary" style="width:auto;padding:10px 16px;">Send</button>
      </div>
      <p class="qv-status" id="qv-email-status"></p>
    </div>

    <iframe id="qv-frame" class="qv-frame" title="Quote preview"></iframe>
  </div>

  <div id="qv-missing" style="display:none;text-align:center;padding:40px 16px;color:var(--muted);">Quote not found.</div>
</main>

<script src="/quote-view.js"></script>
</body>
</html>
